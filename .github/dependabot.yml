version: 2

registries:
  maven-releases:
    type: maven-repository
    url: https://maven.398ja.xyz/releases
  maven-snapshots:
    type: maven-repository
    url: https://maven.398ja.xyz/snapshots

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    registries:
      - maven-releases
      - maven-snapshots
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
